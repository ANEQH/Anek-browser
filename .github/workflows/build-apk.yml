name: Build Debug APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Copy the APK out of the nested Gradle output folder and give it a clean,
      # stable name so the artifact (and the release asset) is obviously the APK.
      - name: Stage APK
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist

          SRC=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::No APK was produced by assembleDebug"
            exit 1
          fi

          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          VERSION_NAME=${VERSION_NAME:-0.0.0}
          VERSION_CODE=${VERSION_CODE:-1}
          SHA_SHORT=$(git rev-parse --short HEAD)

          OUT="dist/Anek-Browser-v${VERSION_NAME}-${SHA_SHORT}-debug.apk"
          cp "$SRC" "$OUT"
          # A stable filename as well, so a permanent download URL always works.
          cp "$SRC" "dist/Anek-Browser-debug.apk"

          SIZE=$(du -h "$OUT" | cut -f1)
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "✅ Built $OUT ($SIZE) — v$VERSION_NAME (code $VERSION_CODE) @ $SHA_SHORT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anek-Browser-debug-APK
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # Publish to a rolling "nightly" release on every push to main.
      # This gives a permanent, no-login-required direct download URL:
      #   https://github.com/ANEQH/Anek-browser/releases/download/nightly/Anek-Browser-debug.apk
      # Versioned filenames change every build, so old ones would otherwise pile
      # up on the rolling release forever. Keep only the stable name.
      - name: Remove stale assets from the nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          CURRENT="Anek-Browser-v${{ steps.stage.outputs.version_name }}-${{ steps.stage.outputs.sha_short }}-debug.apk"
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No nightly release yet — nothing to clean."
            exit 0
          fi
          gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r name; do
            if [ "$name" != "Anek-Browser-debug.apk" ] && [ "$name" != "$CURRENT" ]; then
              echo "Removing stale asset: $name"
              gh release delete-asset nightly "$name" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          done

      - name: Publish to nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build — v${{ steps.stage.outputs.version_name }} (${{ steps.stage.outputs.sha_short }})"
          body: |
            ## 📱 Direct APK download

            **[Anek-Browser-debug.apk](https://github.com/ANEQH/Anek-browser/releases/download/nightly/Anek-Browser-debug.apk)**

            | | |
            |---|---|
            | Version | `${{ steps.stage.outputs.version_name }}` (code ${{ steps.stage.outputs.version_code }}) |
            | Commit | `${{ steps.stage.outputs.sha_short }}` |
            | Size | ${{ steps.stage.outputs.size }} |
            | Type | Debug build (signed with the debug keystore — installable directly) |
            | Updated | ${{ github.event.head_commit.timestamp }} |

            ### Install
            1. Download the APK above.
            2. Android will warn "unknown source" → allow it for your browser/file manager.
            3. Tap the APK to install.

            > ⚠️ This is an **automated nightly build** from the `main` branch. It is replaced on every push.
          files: |
            dist/Anek-Browser-debug.apk
            dist/Anek-Browser-v${{ steps.stage.outputs.version_name }}-${{ steps.stage.outputs.sha_short }}-debug.apk
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
